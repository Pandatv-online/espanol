<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="sans-serif">
  <title>Baremo NO APTO: E; D D; D + 5 L; 10 L</title>
  <text x="360" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2a44">NO APTO si…</text>
  <!-- row 1: E -->
  <text x="30" y="98" font-size="20" fill="#1f2a44">1 eliminatoria</text>
  <rect x="230" y="70" width="44" height="44" rx="8" fill="#c0392b"/><text x="252" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">E</text>
  <!-- row 2: DD -->
  <text x="30" y="168" font-size="20" fill="#1f2a44">2 deficientes</text>
  <g font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="230" y="140" width="44" height="44" rx="8" fill="#e08a00"/><text x="252" y="170">D</text>
    <rect x="282" y="140" width="44" height="44" rx="8" fill="#e08a00"/><text x="304" y="170">D</text>
  </g>
  <!-- row 3: D + 5L -->
  <text x="30" y="238" font-size="20" fill="#1f2a44">1 deficiente + 5 leves</text>
  <g font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="230" y="210" width="44" height="44" rx="8" fill="#e08a00"/><text x="252" y="240">D</text>
    <rect x="290" y="210" width="38" height="44" rx="8" fill="#2a8c82"/><text x="309" y="240">L</text>
    <rect x="332" y="210" width="38" height="44" rx="8" fill="#2a8c82"/><text x="351" y="240">L</text>
    <rect x="374" y="210" width="38" height="44" rx="8" fill="#2a8c82"/><text x="393" y="240">L</text>
    <rect x="416" y="210" width="38" height="44" rx="8" fill="#2a8c82"/><text x="435" y="240">L</text>
    <rect x="458" y="210" width="38" height="44" rx="8" fill="#2a8c82"/><text x="477" y="240">L</text>
  </g>
  <!-- row 4: 10L -->
  <text x="30" y="308" font-size="20" fill="#1f2a44">10 leves</text>
  <g font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="230" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="249" y="310">L</text>
    <rect x="272" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="291" y="310">L</text>
    <rect x="314" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="333" y="310">L</text>
    <rect x="356" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="375" y="310">L</text>
    <rect x="398" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="417" y="310">L</text>
    <rect x="440" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="459" y="310">L</text>
    <rect x="482" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="501" y="310">L</text>
    <rect x="524" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="543" y="310">L</text>
    <rect x="566" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="585" y="310">L</text>
    <rect x="608" y="280" width="38" height="44" rx="8" fill="#2a8c82"/><text x="627" y="310">L</text>
  </g>
  <text x="360" y="362" text-anchor="middle" font-size="18" fill="#4a5568">APTO: p. ej. D + 4 L, o 9 L</text>
</svg>

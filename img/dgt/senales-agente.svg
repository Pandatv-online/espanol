<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="sans-serif">
  <title>Señales con el brazo del agente</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <g id="body">
      <circle cx="0" cy="-118" r="18" fill="#f2c9a0" stroke="#1f2937" stroke-width="3"/>
      <path d="M-24,-138 h48 l-6,-12 h-36 z" fill="#1e3a8a"/>
      <rect x="-22" y="-98" width="44" height="74" rx="10" fill="#1e3a8a"/>
      <rect x="-22" y="-78" width="44" height="10" fill="#facc15"/>
      <line x1="-11" y1="-26" x2="-14" y2="40" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
      <line x1="11" y1="-26" x2="14" y2="40" stroke="#1f2937" stroke-width="12" stroke-linecap="round"/>
    </g>
  </defs>
  <g stroke-linecap="round">
    <!-- 1: brazo levantado -->
    <g transform="translate(100,210)">
      <line x1="-20" y1="-90" x2="-30" y2="-30" stroke="#1e3a8a" stroke-width="11"/>
      <line x1="22" y1="-90" x2="36" y2="-188" stroke="#1e3a8a" stroke-width="11"/>
      <circle cx="37" cy="-194" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
      <use href="#body"/>
    </g>
    <!-- 2: brazos extendidos -->
    <g transform="translate(300,210)">
      <line x1="-20" y1="-88" x2="-88" y2="-88" stroke="#1e3a8a" stroke-width="11"/>
      <line x1="20" y1="-88" x2="88" y2="-88" stroke="#1e3a8a" stroke-width="11"/>
      <circle cx="-94" cy="-88" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
      <circle cx="94" cy="-88" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
      <use href="#body"/>
    </g>
    <!-- 3: brazo arriba y abajo -->
    <g transform="translate(500,210)">
      <line x1="-20" y1="-90" x2="-30" y2="-30" stroke="#1e3a8a" stroke-width="11"/>
      <line x1="20" y1="-88" x2="86" y2="-88" stroke="#1e3a8a" stroke-width="11"/>
      <circle cx="92" cy="-88" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
      <line x1="80" y1="-130" x2="80" y2="-46" stroke="#c2410c" stroke-width="5" marker-start="url(#ah)" marker-end="url(#ah)"/>
      <use href="#body"/>
    </g>
    <!-- 4: balanceo de luz -->
    <g transform="translate(700,210)">
      <line x1="-20" y1="-90" x2="-30" y2="-30" stroke="#1e3a8a" stroke-width="11"/>
      <line x1="20" y1="-90" x2="52" y2="-54" stroke="#1e3a8a" stroke-width="11"/>
      <line x1="56" y1="-50" x2="56" y2="-34" stroke="#1f2937" stroke-width="4"/>
      <circle cx="56" cy="-22" r="13" fill="#dc2626" stroke="#1f2937" stroke-width="3"/>
      <path d="M26,-4 Q56,14 86,-4" fill="none" stroke="#c2410c" stroke-width="5" marker-start="url(#ah)" marker-end="url(#ah)"/>
      <use href="#body"/>
    </g>
  </g>
  <g font-size="18" text-anchor="middle" fill="#1f2937">
    <text x="100" y="285" font-weight="bold">Brazo levantado</text>
    <text x="100" y="310">Alto a todos</text>
    <text x="300" y="285" font-weight="bold">Brazos extendidos</text>
    <text x="300" y="310">Alto: frente y detrás</text>
    <text x="500" y="285" font-weight="bold">Arriba y abajo</text>
    <text x="500" y="310">Reducir velocidad</text>
    <text x="700" y="285" font-weight="bold">Luz roja o amarilla</text>
    <text x="700" y="310">Alto a quien ilumina</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="200" y1="20" x2="200" y2="320"/>
    <line x1="400" y1="20" x2="400" y2="320"/>
    <line x1="600" y1="20" x2="600" y2="320"/>
  </g>
</svg>

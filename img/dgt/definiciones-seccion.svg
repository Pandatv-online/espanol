<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="sans-serif">
  <!-- road runs left-right; traffic drives on the right: top carriageway goes left, bottom goes right -->
  <!-- aceras -->
  <rect x="0" y="0" width="580" height="44" fill="#d3d6db"/>
  <rect x="0" y="426" width="580" height="44" fill="#d3d6db"/>
  <!-- bordillos -->
  <rect x="0" y="42" width="580" height="4" fill="#8a9099"/>
  <rect x="0" y="424" width="580" height="4" fill="#8a9099"/>
  <!-- plataforma superior -->
  <rect x="0" y="46" width="580" height="160" fill="#5b6470"/>
  <!-- mediana -->
  <rect x="0" y="206" width="580" height="58" fill="#9cc58a"/>
  <!-- plataforma inferior -->
  <rect x="0" y="264" width="580" height="160" fill="#5b6470"/>
  <!-- lineas de borde (arcén | calzada) -->
  <rect x="0" y="84" width="580" height="4" fill="#ffffff"/>
  <rect x="0" y="382" width="580" height="4" fill="#ffffff"/>
  <!-- lineas de borde junto a la mediana -->
  <rect x="0" y="200" width="580" height="3" fill="#ffffff"/>
  <rect x="0" y="267" width="580" height="3" fill="#ffffff"/>
  <!-- separacion de carriles (discontinua) -->
  <line x1="0" y1="144" x2="580" y2="144" stroke="#ffffff" stroke-width="4" stroke-dasharray="36 28"/>
  <line x1="0" y1="326" x2="580" y2="326" stroke="#ffffff" stroke-width="4" stroke-dasharray="36 28"/>

  <!-- etiquetas de franjas -->
  <text x="14" y="29" font-size="18" fill="#1f2630" font-weight="bold">acera</text>
  <text x="14" y="72" font-size="18" fill="#ffffff" font-weight="bold">arcén</text>
  <text x="14" y="122" font-size="18" fill="#ffffff">carril</text>
  <text x="14" y="180" font-size="18" fill="#ffffff">carril</text>
  <text x="14" y="241" font-size="18" fill="#24452a" font-weight="bold">mediana</text>
  <text x="14" y="305" font-size="18" fill="#ffffff">carril</text>
  <text x="14" y="362" font-size="18" fill="#ffffff">carril</text>
  <text x="14" y="410" font-size="18" fill="#ffffff" font-weight="bold">arcén</text>
  <text x="14" y="455" font-size="18" fill="#1f2630" font-weight="bold">acera</text>

  <!-- coches: arriba hacia la izquierda, abajo hacia la derecha -->
  <rect x="300" y="98" width="84" height="34" rx="9" fill="#e0a526"/>
  <rect x="306" y="104" width="16" height="22" rx="3" fill="#2f3a48"/>
  <rect x="160" y="156" width="84" height="34" rx="9" fill="#3d7dd8"/>
  <rect x="166" y="162" width="16" height="22" rx="3" fill="#2f3a48"/>
  <rect x="200" y="280" width="84" height="34" rx="9" fill="#d65a4a"/>
  <rect x="262" y="286" width="16" height="22" rx="3" fill="#2f3a48"/>
  <rect x="380" y="338" width="84" height="34" rx="9" fill="#2aa198"/>
  <rect x="442" y="344" width="16" height="22" rx="3" fill="#2f3a48"/>
  <!-- flechas de sentido -->
  <g fill="#ffffff">
    <path d="M520 112 h-50 v-8 l-22 12 l22 12 v-8 h50 z"/>
    <path d="M520 170 h-50 v-8 l-22 12 l22 12 v-8 h50 z"/>
    <path d="M90 294 h50 v-8 l22 12 l-22 12 v-8 h-50 z"/>
    <path d="M90 352 h50 v-8 l22 12 l-22 12 v-8 h-50 z"/>
  </g>

  <!-- llaves: calzada y plataforma (arriba) -->
  <g stroke="#1f2630" stroke-width="3" fill="none">
    <path d="M592 88 h10 v112 h-10"/>
    <path d="M672 46 h10 v160 h-10"/>
    <path d="M592 270 h10 v112 h-10"/>
    <path d="M672 264 h10 v160 h-10"/>
  </g>
  <g font-size="17" fill="#1f2630" font-weight="bold">
    <text x="608" y="150">calzada</text>
    <text x="688" y="132">plata-</text>
    <text x="688" y="152">forma</text>
    <text x="608" y="332">calzada</text>
    <text x="688" y="350">plata-</text>
    <text x="688" y="370">forma</text>
  </g>
  <text x="590" y="240" font-size="16" fill="#4a525e">2 calzadas</text>
</svg>

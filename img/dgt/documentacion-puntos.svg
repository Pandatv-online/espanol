<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="sans-serif">
  <title>Permiso por puntos: 0, 8, 12 y 15 puntos</title>
  <text x="360" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2a44">Saldo de puntos del permiso</text>
  <!-- scale bar 0..15, x from 60 to 660 => 40 px per point -->
  <rect x="60" y="120" width="40" height="36" fill="#c0392b"/>
  <rect x="100" y="120" width="280" height="36" fill="#e9a23b"/>
  <rect x="380" y="120" width="160" height="36" fill="#2e8b57"/>
  <rect x="540" y="120" width="120" height="36" fill="#1f6fb2"/>
  <rect x="60" y="120" width="600" height="36" fill="none" stroke="#1f2a44" stroke-width="2"/>
  <g font-size="16" fill="#1f2a44" text-anchor="middle">
    <text x="60" y="180">0</text><text x="380" y="180">8</text><text x="540" y="180">12</text><text x="660" y="180">15</text>
  </g>
  <g stroke="#1f2a44" stroke-width="2">
    <line x1="60" y1="110" x2="60" y2="164"/><line x1="380" y1="104" x2="380" y2="164"/>
    <line x1="540" y1="104" x2="540" y2="164"/><line x1="660" y1="110" x2="660" y2="164"/>
  </g>
  <g font-size="17" fill="#1f2a44">
    <text x="380" y="70" text-anchor="middle" font-weight="bold">8 · novel</text>
    <text x="380" y="92" text-anchor="middle">al obtener el permiso</text>
    <text x="560" y="70" text-anchor="middle" font-weight="bold">12 · general</text>
    <text x="560" y="92" text-anchor="middle">2 años sin sanciones</text>
  </g>
  <g font-size="17" fill="#1f2a44">
    <text x="60" y="214" font-weight="bold">0 · pérdida de vigencia</text>
    <text x="60" y="238">sin permiso: curso + examen teórico</text>
    <text x="660" y="214" text-anchor="end" font-weight="bold">15 · máximo</text>
    <text x="660" y="238" text-anchor="end">con bonificaciones</text>
  </g>
  <path d="M 300 278 L 470 278" stroke="#2e8b57" stroke-width="4" fill="none"/>
  <path d="M 470 270 L 486 278 L 470 286 Z" fill="#2e8b57"/>
  <text x="290" y="284" text-anchor="end" font-size="17" fill="#1f2a44">curso de reeducación vial:</text>
  <text x="494" y="284" font-size="17" fill="#1f2a44" font-weight="bold">hasta +6 puntos</text>
</svg>

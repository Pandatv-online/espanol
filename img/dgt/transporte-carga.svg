<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif">
  <title>Carga que sobresale por detrás de un turismo: 10 % o 15 % de la longitud y panel V-20</title>
  <defs>
    <pattern id="v20" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffffff"/><rect width="7" height="14" fill="#d32f2f"/>
    </pattern>
  </defs>
  <rect x="0" y="262" width="760" height="40" fill="#5b6470"/>
  <!-- car: length 400 px = 4 m (x 120..520) -->
  <rect x="120" y="190" width="400" height="58" rx="16" fill="#1f6fb2"/>
  <path d="M 200 192 L 250 142 L 420 142 L 470 192 Z" fill="#1f6fb2"/>
  <path d="M 262 152 L 330 152 L 330 188 L 228 188 Z" fill="#cfe3f5"/>
  <path d="M 342 152 L 412 152 L 452 188 L 342 188 Z" fill="#cfe3f5"/>
  <circle cx="210" cy="250" r="26" fill="#1f2a44"/><circle cx="210" cy="250" r="10" fill="#c9ced6"/>
  <circle cx="440" cy="250" r="26" fill="#1f2a44"/><circle cx="440" cy="250" r="10" fill="#c9ced6"/>
  <rect x="500" y="200" width="18" height="16" rx="3" fill="#d32f2f"/>
  <!-- roof bars and load: indivisible board overhanging 60 px = 0,60 m = 15 % -->
  <rect x="250" y="132" width="10" height="10" fill="#1f2a44"/><rect x="410" y="132" width="10" height="10" fill="#1f2a44"/>
  <rect x="230" y="120" width="350" height="12" rx="3" fill="#a0692b"/>
  <!-- V-20 panel at the end of the load -->
  <rect x="574" y="96" width="50" height="50" fill="url(#v20)" stroke="#1f2a44" stroke-width="2"/>
  <text x="634" y="118" font-size="18" font-weight="bold" fill="#1f2a44">V-20</text>
  <text x="634" y="140" font-size="16" fill="#1f2a44">día y noche</text>
  <!-- dimension lines -->
  <g stroke="#1f2a44" stroke-width="2">
    <line x1="120" y1="320" x2="520" y2="320"/><line x1="120" y1="310" x2="120" y2="330"/><line x1="520" y1="310" x2="520" y2="330"/>
    <line x1="520" y1="70" x2="580" y2="70"/><line x1="520" y1="60" x2="520" y2="80"/><line x1="580" y1="60" x2="580" y2="80"/>
    <line x1="520" y1="80" x2="520" y2="190" stroke-dasharray="5 5"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="18" fill="#1f2a44">longitud del turismo: 4 m</text>
  <text x="520" y="52" text-anchor="middle" font-size="17" fill="#1f2a44" font-weight="bold">máx. 0,60 m (15 %)</text>
  <text x="20" y="40" font-size="18" fill="#1f2a44" font-weight="bold">Solo por detrás:</text>
  <text x="20" y="64" font-size="17" fill="#1f2a44">carga divisible → 10 %</text>
  <text x="20" y="88" font-size="17" fill="#1f2a44">carga indivisible → 15 %</text>
  <text x="740" y="200" text-anchor="end" font-size="17" fill="#d32f2f" font-weight="bold">de noche:</text>
  <text x="740" y="222" text-anchor="end" font-size="17" fill="#d32f2f" font-weight="bold">luz roja</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="sans-serif">
  <title>Adelantamiento a un ciclista: separación lateral de 1,5 metros</title>
  <text x="390" y="36" font-size="22" font-weight="bold" fill="#1f2a44" text-anchor="middle">Adelantar a un ciclista (carretera de un carril por sentido)</text>
  <!-- road -->
  <rect x="0" y="70" width="780" height="230" fill="#5b6470"/>
  <line x1="0" y1="80" x2="780" y2="80" stroke="#ffffff" stroke-width="4"/>
  <line x1="0" y1="290" x2="780" y2="290" stroke="#ffffff" stroke-width="4"/>
  <line x1="0" y1="185" x2="780" y2="185" stroke="#ffffff" stroke-width="4" stroke-dasharray="36 28"/>
  <text x="16" y="110" font-size="17" fill="#ffffff">carril contrario: libre</text>
  <text x="16" y="276" font-size="17" fill="#ffffff">tu carril</text>
  <!-- direction arrows -->
  <polygon points="700,118 680,108 680,128" fill="#ffffff" opacity="0.5"/>
  <!-- path of the car -->
  <path d="M130 250 C 230 250, 250 140, 360 140 L 520 140 C 620 140, 640 250, 740 250" fill="none" stroke="#f2a900" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="748,250 732,242 732,258" fill="#f2a900"/>
  <!-- cyclist in own lane, near right edge -->
  <g>
    <rect x="420" y="250" width="62" height="12" rx="6" fill="#13806f"/>
    <circle cx="436" cy="256" r="7" fill="#ffffff" stroke="#13806f" stroke-width="3"/>
    <circle cx="470" cy="256" r="7" fill="#ffffff" stroke="#13806f" stroke-width="3"/>
    <circle cx="452" cy="242" r="10" fill="#f2c9a5" stroke="#1f2a44" stroke-width="2"/>
  </g>
  <!-- car in the opposite lane while passing -->
  <rect x="390" y="114" width="120" height="54" rx="12" fill="#4a78b5" stroke="#1f2a44" stroke-width="2"/>
  <rect x="470" y="122" width="26" height="38" rx="5" fill="#bcd3ee"/>
  <!-- lateral gap -->
  <line x1="530" y1="168" x2="530" y2="236" stroke="#f2a900" stroke-width="3"/>
  <polygon points="530,168 523,182 537,182" fill="#f2a900"/>
  <polygon points="530,236 523,222 537,222" fill="#f2a900"/>
  <line x1="510" y1="168" x2="540" y2="168" stroke="#f2a900" stroke-width="2"/>
  <line x1="482" y1="236" x2="540" y2="236" stroke="#f2a900" stroke-width="2"/>
  <rect x="546" y="186" width="96" height="32" rx="8" fill="#ffffff"/>
  <text x="594" y="209" font-size="20" font-weight="bold" fill="#1f2a44" text-anchor="middle">≥ 1,5 m</text>
  <!-- notes -->
  <g font-size="18" fill="#1f2a44">
    <text x="20" y="336"><tspan font-weight="bold">Fuera de poblado:</tspan> velocidad máxima de la vía − 20 km/h (como mínimo)</text>
    <text x="20" y="364"><tspan font-weight="bold">Dos o más carriles por sentido:</tspan> cambio completo de carril</text>
    <text x="20" y="392"><tspan font-weight="bold">Prohibido</tspan> si viene alguien de frente, aunque vaya por el arcén</text>
  </g>
</svg>

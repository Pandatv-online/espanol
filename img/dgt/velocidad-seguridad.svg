<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif">
  <title>Distancia de seguridad: regla de los dos segundos con un punto fijo</title>
  <defs>
    <marker id="ah" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#1f2a37"/></marker>
  <marker id="aw" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#ffffff"/></marker>
  </defs>
  <text x="380" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2a37">«uno… dos…»: al menos 2 segundos</text>
  <!-- post -->
  <rect x="514" y="48" width="8" height="66" fill="#1f2a37"/>
  <circle cx="518" cy="50" r="10" fill="#e0a526"/>
  <text x="534" y="70" font-size="17" fill="#1f2a37">punto fijo</text>
  <!-- road -->
  <rect x="20" y="114" width="720" height="110" fill="#5b6470"/>
  <line x1="20" y1="118" x2="740" y2="118" stroke="#ffffff" stroke-width="3"/>
  <line x1="20" y1="220" x2="740" y2="220" stroke="#ffffff" stroke-width="3"/>
  <!-- front car passes the post -->
  <rect x="518" y="146" width="96" height="44" rx="10" fill="#c8453b"/>
  <rect x="574" y="152" width="22" height="32" rx="4" fill="#f4d9d6"/>
  <!-- rear car -->
  <rect x="150" y="146" width="96" height="44" rx="10" fill="#2f6fb3"/>
  <rect x="206" y="152" width="22" height="32" rx="4" fill="#cfe3f5"/>
  <!-- direction -->
  <line x1="640" y1="168" x2="720" y2="168" stroke="#ffffff" stroke-width="4" marker-end="url(#aw)"/>
  <!-- gap -->
  <line x1="246" y1="232" x2="246" y2="262" stroke="#1f2a37" stroke-width="2"/>
  <line x1="518" y1="232" x2="518" y2="262" stroke="#1f2a37" stroke-width="2"/>
  <line x1="252" y1="250" x2="512" y2="250" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="512" y1="250" x2="252" y2="250" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="382" y="286" font-size="18" text-anchor="middle" fill="#1f2a37">distancia de seguridad</text>
  <text x="20" y="286" font-size="16" fill="#1f2a37">lluvia, niebla, noche: +1 s</text>
</svg>

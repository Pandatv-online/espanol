<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="sans-serif">
  <title>Tramo estrecho sin señales</title>
  <path d="M0,60 H200 L250,110 H510 L560,60 H760 V240 H560 L510,190 H250 L200,240 H0 Z" fill="#5b6470"/>
  <g stroke="#ffffff" stroke-width="5" stroke-dasharray="26 20">
    <line x1="0" y1="150" x2="190" y2="150"/>
    <line x1="570" y1="150" x2="760" y2="150"/>
  </g>
  <g stroke="#ffffff" stroke-width="4">
    <line x1="250" y1="110" x2="510" y2="110"/>
    <line x1="250" y1="190" x2="510" y2="190"/>
  </g>
  <!-- camión hacia la derecha -->
  <rect x="262" y="122" width="104" height="56" rx="6" fill="#d97706"/>
  <rect x="368" y="126" width="30" height="48" rx="8" fill="#b45309"/>
  <path d="M406,140 L420,150 L406,160 z" fill="#ffffff"/>
  <!-- turismo hacia la izquierda -->
  <rect x="452" y="130" width="58" height="40" rx="10" fill="#2563eb"/>
  <path d="M444,140 L430,150 L444,160 z" fill="#ffffff"/>
  <g font-size="22" fill="#1f2937" text-anchor="middle">
    <text x="314" y="96" font-weight="bold">Camión</text>
    <text x="482" y="96" font-weight="bold">Turismo</text>
    <text x="380" y="280">Tramo estrecho sin señales:</text>
    <text x="380" y="306">no se sabe quién entró primero</text>
  </g>
  <text x="425" y="230" font-size="40" font-weight="bold" fill="#dc2626" text-anchor="middle">?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="sans-serif">
  <title>Giro a la izquierda en una calzada de doble sentido: junto a la línea central y dejando el centro de la intersección a la izquierda</title>
  <defs>
    <marker id="ok" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#2e9a5a"/></marker>
    <marker id="no" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#d23b2f"/></marker>
  </defs>
  <!-- roads -->
  <rect x="290" y="20" width="120" height="520" fill="#5b6470"/>
  <rect x="20" y="220" width="660" height="120" fill="#5b6470"/>
  <!-- edge lines -->
  <g stroke="#ffffff" stroke-width="3">
    <line x1="294" y1="20" x2="294" y2="216"/><line x1="406" y1="20" x2="406" y2="216"/>
    <line x1="294" y1="344" x2="294" y2="540"/><line x1="406" y1="344" x2="406" y2="540"/>
    <line x1="20" y1="224" x2="286" y2="224"/><line x1="20" y1="336" x2="286" y2="336"/>
    <line x1="414" y1="224" x2="680" y2="224"/><line x1="414" y1="336" x2="680" y2="336"/>
  </g>
  <!-- centre lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="22 14">
    <line x1="350" y1="20" x2="350" y2="206"/><line x1="350" y1="354" x2="350" y2="540"/>
    <line x1="20" y1="280" x2="276" y2="280"/><line x1="424" y1="280" x2="680" y2="280"/>
  </g>
  <!-- centre of the junction -->
  <circle cx="350" cy="280" r="9" fill="#e0a526" stroke="#ffffff" stroke-width="2"/>
  <!-- wrong path -->
  <path d="M 378 420 Q 360 300 240 262" fill="none" stroke="#d23b2f" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#no)"/>
  <!-- right path -->
  <path d="M 370 420 L 370 290 Q 370 250 320 250 L 220 250" fill="none" stroke="#2e9a5a" stroke-width="6" marker-end="url(#ok)"/>
  <!-- car next to the centre line -->
  <rect x="356" y="430" width="34" height="62" rx="8" fill="#2f6fb3"/>
  <rect x="361" y="438" width="24" height="14" rx="3" fill="#cfe3f5"/>
  <!-- labels -->
  <text x="430" y="200" font-size="17" fill="#1f2a37">centro de la intersección</text>
  <line x1="428" y1="206" x2="362" y2="272" stroke="#1f2a37" stroke-width="1.5"/>
  <rect x="20" y="20" width="250" height="56" rx="8" fill="#e6f4ea"/>
  <text x="34" y="44" font-size="17" font-weight="bold" fill="#2e9a5a">Bien:</text>
  <text x="34" y="66" font-size="16" fill="#1f2a37">el centro queda a la izquierda</text>
  <rect x="20" y="400" width="250" height="56" rx="8" fill="#fbe7e5"/>
  <text x="34" y="424" font-size="17" font-weight="bold" fill="#d23b2f">Mal:</text>
  <text x="34" y="446" font-size="16" fill="#1f2a37">cortar en diagonal</text>
  <text x="420" y="470" font-size="16" fill="#1f2a37">junto a la línea central,</text>
  <text x="420" y="492" font-size="16" fill="#1f2a37">sin invadir el sentido contrario</text>
</svg>

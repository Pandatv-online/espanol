<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif">
  <!-- one carriageway, three lanes, traffic left to right: right lane is at the bottom -->
  <rect x="0" y="0" width="760" height="36" fill="#9cc58a"/>
  <text x="14" y="25" font-size="17" fill="#24452a" font-weight="bold">mediana</text>
  <rect x="0" y="36" width="760" height="270" fill="#5b6470"/>
  <rect x="0" y="40" width="760" height="3" fill="#ffffff"/>
  <line x1="0" y1="113" x2="760" y2="113" stroke="#ffffff" stroke-width="4" stroke-dasharray="36 28"/>
  <line x1="0" y1="186" x2="760" y2="186" stroke="#ffffff" stroke-width="4" stroke-dasharray="36 28"/>
  <rect x="0" y="257" width="760" height="4" fill="#ffffff"/>
  <rect x="0" y="306" width="760" height="4" fill="#8a9099"/>
  <g font-size="17" fill="#ffffff">
    <text x="14" y="70">carril izquierdo</text>
    <text x="14" y="143">carril central</text>
    <text x="14" y="216">carril derecho</text>
    <text x="14" y="289" font-weight="bold">arcén</text>
  </g>
  <!-- left lane: only to overtake -->
  <text x="300" y="86" font-size="17" fill="#ffd27a">solo para adelantar</text>
  <!-- truck in right lane -->
  <rect x="190" y="194" width="150" height="48" rx="6" fill="#e0a526"/>
  <rect x="318" y="198" width="18" height="40" rx="3" fill="#2f3a48"/>
  <text x="212" y="225" font-size="17" fill="#1f2630" font-weight="bold">camión</text>
  <!-- car in right lane -->
  <rect x="400" y="200" width="84" height="36" rx="9" fill="#2aa198"/>
  <rect x="462" y="206" width="16" height="24" rx="3" fill="#2f3a48"/>
  <!-- overtaking car in centre lane -->
  <rect x="500" y="128" width="84" height="36" rx="9" fill="#3d7dd8"/>
  <rect x="562" y="134" width="16" height="24" rx="3" fill="#2f3a48"/>
  <path d="M600 146 C 640 146, 650 218, 700 220" stroke="#ffffff" stroke-width="5" fill="none" stroke-dasharray="10 8"/>
  <path d="M714 220 l-18 -10 v20 z" fill="#ffffff"/>
  <text x="560" y="122" font-size="16" fill="#ffffff">vuelve a la derecha</text>
  <!-- direction arrows -->
  <g fill="#ffffff">
    <path d="M640 62 h50 v-8 l22 12 l-22 12 v-8 h-50 z"/>
    <path d="M190 136 h50 v-8 l22 12 l-22 12 v-8 h-50 z"/>
  </g>
  <!-- note -->
  <text x="14" y="346" font-size="17" fill="#1f2630" font-weight="bold">Camión &gt; 3.500 kg y conjunto &gt; 7 m:</text>
  <text x="14" y="372" font-size="17" fill="#1f2630">carril derecho y, como máximo, el central</text>
</svg>

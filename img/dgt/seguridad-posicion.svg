<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" font-family="sans-serif">
  <title>Posición correcta del cinturón de seguridad y del reposacabezas</title>
  <!-- floor -->
  <line x1="250" y1="440" x2="700" y2="440" stroke="#c9ced6" stroke-width="3"/>
  <!-- seat: cushion, backrest (slightly reclined), headrest -->
  <rect x="300" y="352" width="190" height="34" rx="12" fill="#8a94a3"/>
  <polygon points="300,386 338,386 306,170 270,172" fill="#8a94a3"/>
  <line x1="304" y1="386" x2="304" y2="440" stroke="#8a94a3" stroke-width="10"/>
  <line x1="470" y1="386" x2="470" y2="440" stroke="#8a94a3" stroke-width="10"/>
  <rect x="266" y="98" width="38" height="66" rx="10" fill="#6b7482"/>
  <line x1="285" y1="164" x2="287" y2="176" stroke="#6b7482" stroke-width="5"/>
  <!-- person -->
  <circle cx="348" cy="132" r="32" fill="#f2c9a5" stroke="#1f2a44" stroke-width="2"/>
  <rect x="340" y="160" width="18" height="22" fill="#f2c9a5"/>
  <polygon points="314,178 374,178 392,348 330,352" fill="#4a78b5"/>
  <!-- thigh and lower leg -->
  <line x1="350" y1="340" x2="520" y2="338" stroke="#2f3e58" stroke-width="34" stroke-linecap="round"/>
  <line x1="520" y1="338" x2="560" y2="430" stroke="#2f3e58" stroke-width="28" stroke-linecap="round"/>
  <rect x="548" y="424" width="44" height="16" rx="6" fill="#1f2a44"/>
  <!-- arm -->
  <line x1="364" y1="196" x2="430" y2="270" stroke="#4a78b5" stroke-width="20" stroke-linecap="round"/>
  <line x1="430" y1="270" x2="560" y2="236" stroke="#f2c9a5" stroke-width="15" stroke-linecap="round"/>
  <!-- steering wheel + column + dashboard -->
  <line x1="578" y1="240" x2="660" y2="290" stroke="#5b6470" stroke-width="10"/>
  <ellipse cx="574" cy="236" rx="13" ry="58" fill="none" stroke="#1f2a44" stroke-width="9"/>
  <path d="M640 200 L740 200 L740 300 L660 300 Z" fill="#c9ced6"/>
  <!-- seat belt: chest band and lap band -->
  <line x1="322" y1="182" x2="386" y2="330" stroke="#e0a100" stroke-width="12" stroke-linecap="round"/>
  <line x1="322" y1="336" x2="398" y2="334" stroke="#e0a100" stroke-width="12" stroke-linecap="round"/>
  <rect x="384" y="322" width="22" height="24" rx="4" fill="#1f2a44"/>
  <!-- headrest top = top of head -->
  <line x1="240" y1="99" x2="400" y2="99" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- gap head–headrest -->
  <line x1="304" y1="66" x2="304" y2="92" stroke="#c0392b" stroke-width="2"/>
  <line x1="316" y1="66" x2="316" y2="120" stroke="#c0392b" stroke-width="2"/>
  <text x="310" y="58" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">≤ 4 cm</text>
  <!-- distance chest–wheel -->
  <line x1="388" y1="150" x2="556" y2="150" stroke="#c0392b" stroke-width="2"/>
  <polygon points="388,150 400,144 400,156" fill="#c0392b"/>
  <polygon points="556,150 544,144 544,156" fill="#c0392b"/>
  <line x1="378" y1="150" x2="378" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="472" y="140" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">≥ 25 cm</text>
  <!-- numbered markers -->
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="236" cy="130" r="16" fill="#1f2a44"/><text x="236" y="136">1</text>
    <circle cx="250" cy="262" r="16" fill="#1f2a44"/><text x="250" y="268">2</text>
    <circle cx="300" cy="404" r="16" fill="#1f2a44"/><text x="300" y="410">3</text>
    <circle cx="610" cy="150" r="16" fill="#1f2a44"/><text x="610" y="156">4</text>
  </g>
  <line x1="266" y1="262" x2="350" y2="258" stroke="#1f2a44" stroke-width="2"/>
  <line x1="312" y1="392" x2="336" y2="346" stroke="#1f2a44" stroke-width="2"/>
  <!-- legend -->
  <g font-size="18" fill="#1f2a44">
    <text x="30" y="478"><tspan font-weight="bold">1 Reposacabezas:</tspan> borde superior a la altura de la cabeza, a ≤ 4 cm</text>
    <text x="30" y="504"><tspan font-weight="bold">2 Cinta torácica:</tspan> por la clavícula y el centro del pecho</text>
    <text x="30" y="530"><tspan font-weight="bold">3 Cinta abdominal:</tspan> sobre la cadera, nunca sobre el vientre</text>
    <text x="30" y="556"><tspan font-weight="bold">4 Pecho</tspan> a 25 cm o más del volante (airbag)</text>
  </g>
</svg>

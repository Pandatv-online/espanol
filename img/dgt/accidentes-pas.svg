<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="sans-serif">
  <title>Regla PAS: Proteger, Avisar, Socorrer</title>
  <!-- boxes -->
  <rect x="10" y="20" width="230" height="360" rx="18" fill="#fde3dc" stroke="#c0392b" stroke-width="3"/>
  <rect x="275" y="20" width="230" height="360" rx="18" fill="#fdf0cf" stroke="#c98a00" stroke-width="3"/>
  <rect x="540" y="20" width="230" height="360" rx="18" fill="#d8f0ec" stroke="#13806f" stroke-width="3"/>
  <!-- arrows between boxes -->
  <polygon points="244,190 266,200 244,210" fill="#1f2a44"/>
  <polygon points="509,190 531,200 509,210" fill="#1f2a44"/>
  <!-- big letters -->
  <g font-size="64" font-weight="bold" text-anchor="middle">
    <text x="125" y="92" fill="#c0392b">P</text>
    <text x="390" y="92" fill="#c98a00">A</text>
    <text x="655" y="92" fill="#13806f">S</text>
  </g>
  <g font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2a44">
    <text x="125" y="126">Proteger</text>
    <text x="390" y="126">Avisar</text>
    <text x="655" y="126">Socorrer</text>
  </g>
  <!-- icons -->
  <!-- P: V-16 beacon -->
  <rect x="105" y="160" width="40" height="20" rx="4" fill="#1f2a44"/>
  <path d="M108 160 Q125 134 142 160 Z" fill="#f2a900" stroke="#c98a00" stroke-width="2"/>
  <g stroke="#f2a900" stroke-width="3"><line x1="98" y1="150" x2="88" y2="144"/><line x1="152" y1="150" x2="162" y2="144"/></g>
  <!-- A: phone 112 -->
  <rect x="372" y="136" width="36" height="40" rx="6" fill="#1f2a44"/>
  <text x="390" y="162" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">112</text>
  <!-- S: cross -->
  <rect x="645" y="136" width="20" height="40" fill="#13806f"/>
  <rect x="635" y="146" width="40" height="20" fill="#13806f"/>
  <!-- text -->
  <g font-size="17" fill="#1f2a44">
    <text x="28" y="212">· a ti mismo, a las</text>
    <text x="40" y="234">víctimas y el lugar</text>
    <text x="28" y="262">· luces de emergencia,</text>
    <text x="40" y="284">motor parado</text>
    <text x="28" y="312">· chaleco antes de salir</text>
    <text x="28" y="340">· V-16 en el techo</text>
    <text x="28" y="368">· no fumar</text>

    <text x="293" y="212">· llamar al 112</text>
    <text x="293" y="240">· o poste SOS</text>
    <text x="293" y="268">· dónde, qué pasó,</text>
    <text x="305" y="290">cuántos heridos,</text>
    <text x="305" y="312">si hay fuego</text>
    <text x="293" y="340">· quedarse hasta que</text>
    <text x="305" y="362">lleguen los agentes</text>

    <text x="558" y="212">· consciencia y</text>
    <text x="570" y="234">respiración</text>
    <text x="558" y="262">· no mover al herido</text>
    <text x="558" y="290">· no quitar el casco</text>
    <text x="558" y="318">· no dar comida</text>
    <text x="570" y="340">ni bebida</text>
    <text x="558" y="368">· abrigarlo</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif">
  <title>Dónde no parar ni estacionar: paso de peatones, intersección y menos de 3 m hasta la línea continua</title>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#d23b2f" fill-opacity="0.25"/><rect width="4" height="12" fill="#d23b2f" fill-opacity="0.7"/>
    </pattern>
    <marker id="a" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,8 L0,16 Z" fill="#ffffff"/></marker>
  </defs>
  <!-- main street -->
  <rect x="20" y="60" width="720" height="240" fill="#5b6470"/>
  <!-- side street -->
  <rect x="580" y="20" width="120" height="250" fill="#5b6470"/>
  <g stroke="#ffffff" stroke-width="3">
    <line x1="20" y1="64" x2="576" y2="64"/><line x1="20" y1="296" x2="740" y2="296"/>
    <line x1="704" y1="64" x2="740" y2="64"/><line x1="576" y1="20" x2="576" y2="64"/><line x1="704" y1="20" x2="704" y2="64"/>
  </g>
  <!-- continuous centre line -->
  <line x1="20" y1="180" x2="560" y2="180" stroke="#ffffff" stroke-width="5"/>
  <!-- zebra crossing -->
  <g fill="#ffffff">
    <rect x="500" y="72" width="44" height="14"/><rect x="500" y="98" width="44" height="14"/><rect x="500" y="124" width="44" height="14"/>
    <rect x="500" y="150" width="44" height="14"/><rect x="500" y="176" width="44" height="14"/><rect x="500" y="202" width="44" height="14"/>
    <rect x="500" y="228" width="44" height="14"/><rect x="500" y="254" width="44" height="14"/><rect x="500" y="280" width="44" height="12"/>
  </g>
  <!-- forbidden strip along the kerb: crossing and junction -->
  <rect x="420" y="250" width="160" height="44" fill="url(#hatch)"/>
  <!-- correctly parked car -->
  <rect x="110" y="250" width="100" height="42" rx="10" fill="#2f6fb3"/>
  <rect x="168" y="256" width="22" height="30" rx="4" fill="#cfe3f5"/>
  <!-- 3 m gap -->
  <line x1="250" y1="246" x2="250" y2="186" stroke="#ffffff" stroke-width="3" marker-end="url(#a)"/>
  <line x1="250" y1="186" x2="250" y2="246" stroke="#ffffff" stroke-width="3" marker-end="url(#a)"/>
  <text x="266" y="224" font-size="20" font-weight="bold" fill="#ffffff">≥ 3 m</text>
  <text x="34" y="120" font-size="16" fill="#ffffff">línea continua: hasta ella deben quedar 3 m libres</text>
  <!-- labels -->
  <text x="20" y="330" font-size="17" fill="#1f2a37">aparcado paralelo al bordillo, a la derecha</text>
  <rect x="380" y="312" width="22" height="16" fill="url(#hatch)"/>
  <text x="410" y="326" font-size="17" fill="#1f2a37">prohibido parar: paso de peatones</text>
  <text x="410" y="350" font-size="17" fill="#1f2a37">e intersección, si dificulta el giro</text>
  <text x="20" y="40" font-size="17" fill="#1f2a37">calle de doble sentido</text>
</svg>

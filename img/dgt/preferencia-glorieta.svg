<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="sans-serif">
  <title>Entrada en una glorieta</title>
  <rect x="300" y="0" width="100" height="120" fill="#5b6470"/>
  <rect x="300" y="380" width="100" height="160" fill="#5b6470"/>
  <rect x="0" y="200" width="200" height="100" fill="#5b6470"/>
  <rect x="500" y="200" width="200" height="100" fill="#5b6470"/>
  <circle cx="350" cy="250" r="170" fill="#5b6470"/>
  <circle cx="350" cy="250" r="125" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 16"/>
  <circle cx="350" cy="250" r="80" fill="#7fa36b" stroke="#ffffff" stroke-width="5"/>
  <g stroke="#ffffff" stroke-width="5">
    <line x1="350" y1="0" x2="350" y2="76"/>
    <line x1="350" y1="424" x2="350" y2="540"/>
    <line x1="0" y1="250" x2="176" y2="250"/>
    <line x1="524" y1="250" x2="700" y2="250"/>
  </g>
  <!-- línea de ceda el paso en la entrada de A -->
  <line x1="352" y1="428" x2="400" y2="428" stroke="#ffffff" stroke-width="6" stroke-dasharray="10 7"/>
  <path d="M362,450 L390,450 L376,474 z" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- sentido de giro -->
  <g fill="#ffffff">
    <path d="M330,102 L350,92 L350,112 z"/>
    <path d="M192,240 L212,240 L202,260 z"/>
    <path d="M488,260 L508,260 L498,240 z"/>
  </g>
  <g font-size="26" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <rect x="357" y="482" width="36" height="58" rx="9" fill="#2563eb"/>
    <text x="375" y="520">A</text>
    <g transform="translate(240,348) rotate(45)">
      <rect x="-31" y="-18" width="62" height="36" rx="9" fill="#dc2626"/>
      <text x="0" y="9" transform="rotate(-45)">B</text>
    </g>
  </g>
  <g font-size="22" fill="#1f2937">
    <text x="20" y="40" font-weight="bold">Glorieta</text>
    <text x="440" y="440">B está dentro:</text>
    <text x="440" y="466">tiene prioridad.</text>
    <text x="440" y="500">A cede el paso.</text>
  </g>
</svg>
